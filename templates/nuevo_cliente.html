<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo cliente | Electronics Repair Shop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="panel-body">

    <nav class="navbar">

        <h1>Electronics Repair Shop</h1>

        <div class="user-info">
            <span>{{ session["nombre"] }}</span>

            <a href="{{ url_for('logout') }}"
               class="logout">
                Cerrar sesión
            </a>
        </div>

    </nav>


    <main class="panel-container">

        <div class="welcome">

            <h2>Registrar nuevo cliente</h2>

            <p>
                Complete los datos del cliente.
            </p>

        </div>


        <div class="module-card">

            <form method="POST"
                  action="{{ url_for('nuevo_cliente') }}">

                <div class="form-group">

                    <label for="nombre">
                        Nombre *
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido *
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                    >

                </div>


                <div class="form-group">

                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                    >

                </div>


                <div style="display: flex; gap: 10px;">

                    <button type="submit">
                        Guardar cliente
                    </button>

                    <a href="{{ url_for('clientes') }}"
                       style="text-decoration: none; width: 100%;">

                        <button type="button">
                            Cancelar
                        </button>

                    </a>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
